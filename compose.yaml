name: meevy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meevy
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME missing in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meevy
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME missing in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing in .env}
      MEEVY_JWT_SECRET_BASE64: ${MEEVY_JWT_SECRET_BASE64:?MEEVY_JWT_SECRET_BASE64 missing in .env}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
    ports:
      # Solo sul bridge Docker (gateway verificato: 172.17.0.1).
      # Nginx Proxy Manager: http://172.17.0.1:8092
      - "172.17.0.1:8092:8080"
    mem_limit: 1024m

volumes:
  postgres_data:
