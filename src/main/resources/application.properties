# Nome dell'applicazione Spring Boot
spring.application.name=MeevyBackend

# Connessione al database PostgreSQL locale
spring.datasource.url=jdbc:postgresql://localhost:5432/meevy
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configurazione autenticazione JWT
meevy.security.jwt.issuer=meevy
meevy.security.jwt.secret-base64=${MEEVY_JWT_SECRET_BASE64}

# Impedisce di caricare relazioni LAZY
# dopo la conclusione della transazione del Service.
spring.jpa.open-in-view=false

# Gestione delle migration del database
spring.flyway.enabled=true

# Dove vengono salvati i file.
# Se non specifichiamo una cartella, usa MeevyData nella home del PC.
meevy.storage.root=${MEEVY_STORAGE_DIR:${user.home}/MeevyData/files}

# Limiti per il caricamento dei documenti
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
