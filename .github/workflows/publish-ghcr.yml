name: Meevy - Build and publish GHCR

on:
  push:
    branches:
      - deploy/docker

permissions:
  contents: read
  packages: write

concurrency:
  group: meevy-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Il test contextLoads usa PostgreSQL su localhost:5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meevy
          POSTGRES_USER: meevy_ci
          POSTGRES_PASSWORD: meevy_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meevy_ci -d meevy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USERNAME: meevy_ci
      DB_PASSWORD: meevy_ci_test_only

    steps:
      - name: Checkout deploy/docker
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate temporary JWT key for tests
        shell: bash
        run: echo "MEEVY_JWT_SECRET_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Run Maven tests
        run: mvn -B -ntp verify

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dom-doms/meevybackend
          tags: |
            type=raw,value=deploy
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/Dom-Doms/MeevyBackend

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
